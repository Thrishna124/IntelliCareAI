<div class="stat-card">

    <div class="stat-card-header">

        <div class="stat-title">

            {{ title }}

        </div>

        <div class="stat-icon">

            <i class="fas fa-chart-line"></i>

        </div>

    </div>

    <div class="stat-value">

        {{ value|default:"0" }}

    </div>

    <div class="stat-footer">

        Updated in real time

    </div>

</div>
