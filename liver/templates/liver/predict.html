{%load static%}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please enter Liver test results.</title>
    <link rel="stylesheet" type="text/css" href="{% static 'liver_styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/production.css' %}">
</head>
<body>
    <h1 align="center">Liver Disease Prediction</h1>
    <div class="form-container">
    <form method="post" action="{% url 'liver:liver_predict' %}"> <!-- action to render the values to result-->
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Predict</button>
    </form>
</div>
{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}
</body>
</html>
