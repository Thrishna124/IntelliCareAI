{%load static%}

<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" type="text/css" href="{% static 'diabetes_styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/production.css' %}">

</head>
<body>
    <h1 align="center">Diabetes Prediction</h1>
    <div class="form-container">
    <form method="post" action="{% url 'pancreas:diabetes_predict' %}"> <!-- action to render the values to result-->
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Predict</button>
    </form>
</div> 

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
